<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teacher Mission Control</title><style>
:root{--bg:#07091a;--p:#11162eeb;--p2:#1b2345;--t:#f7f8ff;--m:#aeb8d9;--c:#46ddff;--g:#42dfa0;--a:#ffc65c;--r:#ff617d}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0,#29205c88,transparent 35%),linear-gradient(145deg,#07091a,#050616);color:var(--t);font:16px system-ui,sans-serif;min-height:100vh}.app{max-width:1450px;margin:auto;padding:18px}.card{background:var(--p);border:1px solid #43517c;border-radius:20px;padding:20px;box-shadow:0 20px 55px #0008}.top,.row,.head{display:flex;align-items:center;justify-content:space-between;gap:12px}.top{margin-bottom:16px}.brand{font-weight:900;font-size:20px}.muted{color:var(--m)}button,input,select,textarea,a.btn{font:inherit}.btn{border:0;border-radius:11px;padding:10px 13px;font-weight:800;cursor:pointer;text-decoration:none;display:inline-block}.primary{background:linear-gradient(135deg,#9b6dff,#ff5ebc);color:#fff}.soft{background:#252d50;color:#e8ecff;border:1px solid #45527b}.green{background:#187351;color:#fff}.amber{background:#8f631d;color:#fff}.red{background:#922944;color:#fff}.hidden{display:none!important}.auth{max-width:900px;margin:55px auto}.tabs,.controls,.status,.actions{display:flex;gap:8px;flex-wrap:wrap}.tabs{margin:18px 0}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.field{display:grid;gap:6px;margin:10px 0}.field input,.field select,.field textarea{width:100%;padding:12px;border-radius:10px;border:1px solid #4d5b86;background:#080c21;color:#fff}.notice{padding:12px;border-radius:10px;background:#46ddff15;border:1px solid #46ddff55;margin-top:12px}.bad{background:#ff617d15;border-color:#ff617d66}.hero{display:grid;grid-template-columns:1fr 1fr;gap:18px}.code{font-size:clamp(38px,7vw,72px);font-weight:950;color:var(--c);letter-spacing:.05em}.chip{padding:6px 9px;border-radius:999px;background:#ffffff12;border:1px solid #ffffff22;font-size:12px;font-weight:800}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:15px 0}.metric strong{font-size:32px;display:block}.main{display:grid;grid-template-columns:1.35fr .65fr;gap:15px}.teams{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.team,.review{background:#151b37;border:1px solid #43517c;border-radius:15px;padding:14px}.progress{height:9px;background:#ffffff15;border-radius:99px;overflow:hidden;margin:9px 0}.progress span{display:block;height:100%;background:linear-gradient(90deg,var(--c),#9b6dff,#ff5ebc)}.stations{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}.st{padding:6px 2px;text-align:center;border-radius:7px;background:#252d50;font-size:10px}.st.approved{background:#19704f}.st.pending{background:#8b621d}.st.revision{background:#8f2943}.answer{white-space:pre-wrap;background:#080c20;padding:10px;border-radius:9px;margin:9px 0;max-height:240px;overflow:auto;font-size:13px}.queue{display:grid;gap:10px}.toast{position:fixed;right:18px;bottom:18px;background:#111831;border:1px solid #46ddff66;border-radius:10px;padding:11px 14px;opacity:0;transition:.2s}.toast.show{opacity:1}@media(max-width:900px){.hero,.main{grid-template-columns:1fr}.teams{grid-template-columns:1fr}.metrics{grid-template-columns:1fr 1fr}}@media(max-width:600px){.grid2{grid-template-columns:1fr}.app{padding:9px}}
</style></head><body><div class="app"><header class="top"><div><div class="brand">🎛️ Teacher Mission Control</div><div class="muted">The Golden Record Blackout</div></div><div class="actions"><a class="btn soft" href="/" target="_blank">Student page</a><button id="logout" class="btn red hidden">Sign out</button></div></header>
<section id="authView" class="card auth"><h1>Start or reopen a mission</h1><p class="muted">Create a live session, then let groups join from their iPads.</p><div class="tabs"><button id="tabCreate" class="btn primary">Create session</button><button id="tabLogin" class="btn soft">Open existing</button></div><div id="createPane" class="grid2"><div><div class="field"><label>Teacher setup key<input id="adminKey" type="password"></label></div><div class="field"><label>Teacher name<input id="teacherName"></label></div></div><div><div class="field"><label>4–8 digit session PIN<input id="createPin" type="password" inputmode="numeric" maxlength="8"></label></div><div class="field"><label>Duration<select id="duration"><option>45</option><option selected>60</option><option>75</option></select></label></div><button id="createBtn" class="btn primary">Create live session</button></div></div><div id="loginPane" class="grid2 hidden"><div class="field"><label>Session code<input id="loginCode" placeholder="MUSIC-ABC"></label></div><div><div class="field"><label>Teacher PIN<input id="loginPin" type="password" inputmode="numeric"></label></div><button id="loginBtn" class="btn primary">Open dashboard</button></div></div><div id="feedback" class="notice hidden"></div></section>
<main id="dash" class="hidden"><section class="card hero"><div><span class="chip">Student join code</span><div id="sessionCode" class="code">—</div><div class="status"><span id="sessionStatus" class="chip">Active</span><span id="pauseStatus" class="chip">Paused</span><span id="codeStatus" class="chip">Codes hidden</span></div><p id="studentUrl" class="muted"></p></div><div><div class="controls"><button id="pause" class="btn amber">Start mission</button><button id="codes" class="btn soft">Show codes</button><button id="export" class="btn soft">Export CSV</button><button id="close" class="btn red">Close session</button></div><div class="row" style="margin-top:10px"><input id="broadcastInput" style="flex:1;padding:11px;border-radius:10px;border:1px solid #4d5b86;background:#080c21;color:#fff" placeholder="Broadcast a hint"><button id="broadcast" class="btn primary">Send</button></div><div id="currentBroadcast" class="notice hidden"></div></div></section><section class="metrics"><div class="card metric"><span class="muted">Groups</span><strong id="groupCount">0</strong></div><div class="card metric"><span class="muted">Pending</span><strong id="pendingCount">0</strong></div><div class="card metric"><span class="muted">Approvals</span><strong id="approvalCount">0</strong></div><div class="card metric"><span class="muted">Solved</span><strong id="solvedCount">0</strong></div></section><div class="main"><section class="card"><div class="head"><h2>Live group progress</h2></div><div id="teams" class="teams"></div></section><section class="card"><h2>Approval queue</h2><div id="queue" class="queue"></div></section></div></main></div><div id="toast" class="toast"></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";import{getAuth,signInWithCustomToken,signOut,onAuthStateChanged,getIdToken,setPersistence,browserSessionPersistence}from"https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";import{getDatabase,ref,onValue,off}from"https://www.gstatic.com/firebasejs/11.10.0/firebase-database.js";
const $=s=>document.querySelector(s);let auth,db,code=localStorage.getItem("grb-teacher-session")||"",meta={},groups={},broadcast={},listeners=[];const names={s1:"Evidence 1",s2:"Evidence 2",s3:"Evidence 3–4",s4:"Evidence 5",final:"Final"};
function msg(t,b=false){let e=$("#feedback");e.textContent=t;e.className="notice"+(b?" bad":"");e.classList.remove("hidden")}function toast(t){let e=$("#toast");e.textContent=t;e.classList.add("show");clearTimeout(e.t);e.t=setTimeout(()=>e.classList.remove("show"),1800)}function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
async function api(path,p={},secure=false){let h={"content-type":"application/json"};if(secure){if(!auth.currentUser)throw Error("Teacher authentication expired.");h.authorization=`Bearer ${await getIdToken(auth.currentUser,true)}`}let r=await fetch(`/.netlify/functions/${path}`,{method:"POST",headers:h,body:JSON.stringify(p)}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||"Request failed.");return d}
function tab(create){$("#createPane").classList.toggle("hidden",!create);$("#loginPane").classList.toggle("hidden",create)}$("#tabCreate").onclick=()=>tab(true);$("#tabLogin").onclick=()=>tab(false);
async function enter(data){code=data.sessionCode;localStorage.setItem("grb-teacher-session",code);await signInWithCustomToken(auth,data.token);open()}
$("#createBtn").onclick=async()=>{try{await enter(await api("create-session",{adminKey:$("#adminKey").value,teacherName:$("#teacherName").value,pin:$("#createPin").value,durationMinutes:+$("#duration").value}))}catch(e){msg(e.message,true)}};$("#loginBtn").onclick=async()=>{try{await enter(await api("teacher-login",{sessionCode:$("#loginCode").value,pin:$("#loginPin").value}))}catch(e){msg(e.message,true)}};
function clear(){listeners.forEach(x=>off(x));listeners=[]}function open(){if(!db||!code)return;clear();$("#authView").classList.add("hidden");$("#dash").classList.remove("hidden");$("#logout").classList.remove("hidden");$("#sessionCode").textContent=code;$("#studentUrl").textContent=`Students open ${location.origin} and enter ${code}`;for(let [path,set]of[["meta",v=>meta=v],["groups",v=>groups=v],["broadcast",v=>broadcast=v]]){let r=ref(db,`sessions/${code}/${path}`);listeners.push(r);onValue(r,s=>{set(s.val()||{});render()})}}
function answer(k,r={}){if(k==="s1")return`Explanation:\n${r.reason||""}`;if(k==="s2")return`Verb + adverb:\n${r.verbTrend||""}\n\nAdjective + noun:\n${r.nounTrend||""}`;if(k==="s3")return`Recommendation:\n${r.recommendation||""}`;if(k==="final")return`Culprit: ${r.culprit||""}\nEvidence: ${(r.evidence||[]).join(", ")}\n\nReasoning:\n${r.reason||""}\n\nPrevention:\n${r.prevention||""}`;return JSON.stringify(r,null,2)}
function render(){let list=Object.entries(groups),pending=[],apps=0,solved=0;for(let[id,g]of list){for(let k of["s1","s2","s3","s4"])if(g.stations?.[k]?.status==="approved")apps++;for(let k of["s1","s2","s3","final"])if(g.stations?.[k]?.status==="pending")pending.push({id,g,k,d:g.stations[k]});if(g.stations?.final?.status==="approved")solved++}$("#groupCount").textContent=list.length;$("#pendingCount").textContent=pending.length;$("#approvalCount").textContent=apps;$("#solvedCount").textContent=solved;$("#sessionStatus").textContent=meta.status==="closed"?"Closed":"Active";$("#pauseStatus").textContent=meta.paused?"Paused":"Running";$("#codeStatus").textContent=meta.hideCodes?"Codes hidden":"Codes visible";$("#pause").textContent=meta.paused?"Start / resume mission":"Pause all teams";$("#codes").textContent=meta.hideCodes?"Show codes":"Hide codes";$("#close").textContent=meta.status==="closed"?"Reopen session":"Close session";let b=$("#currentBroadcast");b.textContent=broadcast.message||"";b.classList.toggle("hidden",!broadcast.message);
$("#teams").innerHTML=list.length?list.map(([id,g])=>{let sts=Object.keys(names).map(k=>`<div class="st ${g.stations?.[k]?.status||""}">${names[k]}<br>${g.stations?.[k]?.status||"—"}</div>`).join(""),codes=meta.hideCodes?"":Object.entries(g.stations||{}).filter(([,x])=>x.status==="approved"&&x.code).map(([k,x])=>`<span class="chip">${k}: ${esc(x.code)}</span>`).join("");return`<article class="team"><div class="head"><strong>${esc(g.icon||"🎧")} ${esc(g.displayName)}</strong><strong>${g.score||0}</strong></div><div class="progress"><span style="width:${g.progress||0}%"></span></div><div class="stations">${sts}</div><div class="status" style="margin-top:8px">${codes}</div><div class="actions" style="margin-top:9px"><button class="btn soft score" data-id="${id}" data-d="5">+5</button><button class="btn soft score" data-id="${id}" data-d="-5">−5</button><button class="btn red reset" data-id="${id}">Reset</button></div></article>`}).join(""):"<p class=muted>No groups have joined yet.</p>";
$("#queue").innerHTML=pending.length?pending.map(x=>`<article class="review"><strong>${esc(x.g.displayName)} · ${names[x.k]}</strong><div class="answer">${esc(answer(x.k,x.d.response))}</div><textarea class="note" data-key="${x.id}:${x.k}" placeholder="Optional feedback"></textarea><div class="actions"><button class="btn green review" data-id="${x.id}" data-k="${x.k}" data-v="approve">Approve</button><button class="btn red review" data-id="${x.id}" data-k="${x.k}" data-v="revision">Return</button></div></article>`).join(""):"<p class=muted>No answers are waiting.</p>";wire()}
function wire(){document.querySelectorAll(".review").forEach(b=>b.onclick=async()=>{try{let key=`${b.dataset.id}:${b.dataset.k}`,note=document.querySelector(`.note[data-key="${CSS.escape(key)}"]`)?.value||"";await api("review-answer",{teamId:b.dataset.id,station:b.dataset.k,decision:b.dataset.v,feedback:note},true);toast("Updated")}catch(e){toast(e.message)}});document.querySelectorAll(".score").forEach(b=>b.onclick=()=>act("adjust-score",{teamId:b.dataset.id,delta:+b.dataset.d}));document.querySelectorAll(".reset").forEach(b=>b.onclick=()=>confirm("Reset this group?")&&act("reset-group",{teamId:b.dataset.id}))}
async function act(action,x={}){try{await api("teacher-action",{action,...x},true);toast("Dashboard updated")}catch(e){toast(e.message)}}$("#pause").onclick=()=>act("set-paused",{value:!meta.paused});$("#codes").onclick=()=>act("set-hide-codes",{value:!meta.hideCodes});$("#broadcast").onclick=()=>act("broadcast",{message:$("#broadcastInput").value});$("#close").onclick=()=>act(meta.status==="closed"?"reopen-session":"close-session");
$("#logout").onclick=async()=>{if(!confirm("Sign out? The live session will remain available."))return;clear();localStorage.removeItem("grb-teacher-session");code="";await signOut(auth);location.reload()};$("#export").onclick=()=>{let rows=[["Group","Score","Progress"]];Object.values(groups).forEach(g=>rows.push([g.displayName,g.score||0,g.progress||0]));let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([rows.map(r=>r.map(v=>`"${String(v).replaceAll('"','""')}"`).join(",")).join("\n")],{type:"text/csv"}));a.download=`golden-record-${code}.csv`;a.click()};
(async()=>{try{let r=await fetch("/.netlify/functions/config"),c=await r.json();if(!r.ok||!c.configured)throw Error("Firebase is not configured.");let app=initializeApp(c.firebase);auth=getAuth(app);await setPersistence(auth,browserSessionPersistence);db=getDatabase(app);onAuthStateChanged(auth,u=>{if(u&&code)open()})}catch(e){msg(e.message,true)}})();
</script></body></html>
